name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma validate + generate
        working-directory: packages/database
        run: |
          npx prisma validate
          DATABASE_URL=postgresql://mmxm:changeme@localhost:5432/mmxm npx prisma generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (trading-core)
        working-directory: packages/trading-core
        run: npx vitest run

  build:
    runs-on: ubuntu-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: packages/database
        run: DATABASE_URL=postgresql://mmxm:changeme@localhost:5432/mmxm npx prisma generate
      - run: pnpm -r build
